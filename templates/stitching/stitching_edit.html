{% extends 'base.html' %}

{% block page_title %}Edit Stitching Order{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h5 class="fw-bold mb-0"><i class="bi bi-pencil me-2 text-primary"></i>Edit Stitching Order</h5>
    <a href="{% url 'stitching_list' %}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i> Back
    </a>
</div>

<div class="content-card">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Customer Name *</label>
                    <input type="text" name="customer_name" class="form-control"
                           value="{{ order.customer_name }}" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Customer Phone</label>
                    <input type="text" name="customer_phone" class="form-control"
                           value="{{ order.customer_phone|default:'' }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Fabric</label>
                    <input type="text" class="form-control"
                           value="{{ order.fabric.name|default:'No fabric selected' }}" disabled>
                    <div class="form-text">Fabric cannot be changed after order creation.</div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Fabric Quantity Used</label>
                    <input type="text" class="form-control"
                           value="{{ order.fabric_quantity }}" disabled>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Stitching Cost (Rs.)</label>
                    <input type="number" name="stitching_cost" class="form-control"
                           value="{{ order.stitching_cost }}" step="0.01" min="0">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Delivery Date</label>
                    <input type="date" name="delivery_date" class="form-control"
                           value="{{ order.delivery_date|date:'Y-m-d'|default:'' }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Status</label>
                    <select name="status" class="form-select">
                        <option value="pending" {% if order.status == 'pending' %}selected{% endif %}>Pending</option>
                        <option value="in_progress" {% if order.status == 'in_progress' %}selected{% endif %}>In Progress</option>
                        <option value="completed" {% if order.status == 'completed' %}selected{% endif %}>Completed</option>
                        <option value="delivered" {% if order.status == 'delivered' %}selected{% endif %}>Delivered</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Measurements</label>
                    <textarea name="measurements" class="form-control" rows="3">{{ order.measurements|default:'' }}</textarea>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold">Notes</label>
                    <textarea name="notes" class="form-control" rows="2">{{ order.notes|default:'' }}</textarea>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn-primary-custom btn">
                        <i class="bi bi-check-lg me-1"></i> Update Order
                    </button>
                </div>

            </div>
        </form>
    </div>
</div>

{% endblock %}

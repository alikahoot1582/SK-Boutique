{% extends 'base.html' %}

{% block page_title %}New Stitching Order{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h5 class="fw-bold mb-0"><i class="bi bi-scissors me-2 text-primary"></i>New Stitching Order</h5>
    <a href="{% url 'stitching_list' %}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i> Back
    </a>
</div>

<div class="content-card">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Customer Name *</label>
                    <input type="text" name="customer_name" class="form-control"
                           placeholder="e.g. Sara Ahmed" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Customer Phone</label>
                    <input type="text" name="customer_phone" class="form-control"
                           placeholder="e.g. 0300-1234567">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Fabric</label>
                    <select name="fabric" class="form-select">
                        <option value="">-- Select Fabric --</option>
                        {% for product in products %}
                        <option value="{{ product.pk }}">
                            {{ product.name }} (Stock: {{ product.stock }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Fabric Quantity Used</label>
                    <input type="number" name="fabric_quantity" class="form-control"
                           placeholder="0" step="0.01" min="0">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Stitching Cost (Rs.)</label>
                    <input type="number" name="stitching_cost" class="form-control"
                           placeholder="0" step="0.01" min="0">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Delivery Date</label>
                    <input type="date" name="delivery_date" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Status</label>
                    <select name="status" class="form-select">
                        <option value="pending">Pending</option>
                        <option value="in_progress">In Progress</option>
                        <option value="completed">Completed</option>
                        <option value="delivered">Delivered</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Measurements</label>
                    <textarea name="measurements" class="form-control" rows="3"
                              placeholder="e.g. Shirt: 38, Trouser: 36..."></textarea>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold">Notes</label>
                    <textarea name="notes" class="form-control" rows="2"
                              placeholder="Any special instructions..."></textarea>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn-primary-custom btn">
                        <i class="bi bi-check-lg me-1"></i> Save Order
                    </button>
                </div>

            </div>
        </form>
    </div>
</div>

{% endblock %}

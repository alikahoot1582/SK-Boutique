{% extends 'base.html' %}
{% block page_title %}Categories{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h5 class="fw-bold mb-0"><i class="bi bi-tags me-2 text-primary"></i>Categories</h5>
    <a href="{% url 'category_add' %}" class="btn-primary-custom btn"><i class="bi bi-plus-lg me-1"></i> Add Category</a>
</div>
<div class="content-card mb-4">
    <div class="card-body p-3">
        <form method="get" class="row g-2">
            <div class="col-md-10">
                <input type="text" name="search" class="form-control" placeholder="Search category..." value="{{ search }}">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn-primary-custom btn w-100"><i class="bi bi-search me-1"></i> Search</button>
            </div>
        </form>
    </div>
</div>
<div class="content-card">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead><tr><th>#</th><th>Name</th><th>Created</th><th>Actions</th></tr></thead>
            <tbody>
                {% for cat in categories %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td><strong>{{ cat.name }}</strong></td>
                    <td>{{ cat.created_at|date:"d M Y" }}</td>
                    <td><a href="{% url 'category_delete' cat.pk %}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete?')"><i class="bi bi-trash"></i></a></td>
                </tr>
                {% empty %}
                <tr><td colspan="4" class="text-center text-muted py-4">No categories found.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
